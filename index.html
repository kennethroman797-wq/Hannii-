<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Hanni 💗</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#fde2e4,#f8cdda);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  transition:background 1.2s ease;
}

.card{
  background:#fffafa;
  padding:34px;
  border-radius:34px;
  width:90%;
  max-width:390px;
  text-align:center;
  box-shadow:0 30px 60px rgba(244,143,177,.35);
  z-index:5;
  animation:pop .9s ease;
}

@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

h1{
  color:#ec407a;
  margin-bottom:12px;
}

p{
  color:#6d4c5c;
  font-size:16px;
  margin-bottom:18px;
}

.buttons{
  position:relative;
  height:160px;
}

button{
  border:none;
  padding:15px 30px;
  border-radius:45px;
  font-size:16px;
  cursor:pointer;
  position:absolute;
  transition:all .4s ease;
}

/* SÍ */
.yes{
  background:linear-gradient(135deg,#f8bbd0,#f48fb1);
  color:#fff;
  left:45%;
  top:40px;
  box-shadow:0 14px 30px rgba(236,64,122,.45);
}

/* NO */
.no{
  background:#f3e5f5;
  color:#6a5b6e;
  left:15%;
  top:100px;
}

/* latido suave */
.pulse{
  animation:pulse 1.8s infinite;
}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}

/* fuegos */
.spark{
  position:absolute;
  font-size:18px;
  animation:spark 1.1s ease-out forwards;
  pointer-events:none;
}
@keyframes spark{
  from{opacity:1;transform:translate(0,0) scale(1)}
  to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.4)}
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Hanni 💗</h1>
  <p id="text">Tengo algo bonito que preguntarte…</p>
  <p><strong>¿Quieres ser mi San Valentín? 💌</strong></p>

  <div class="buttons">
    <button class="yes pulse" id="yesBtn">Sí 💘</button>
    <button class="no" id="noBtn">No 🙈</button>
  </div>
</div>

<!-- IFRAME DE MÚSICA (vacío al inicio) -->
<iframe
  id="music"
  width="0"
  height="0"
  src=""
  frameborder="0"
  allow="autoplay">
</iframe>

<script>
const phrases=[
  "¿Segura? 🥺",
  "Prometo cuidarte bonito 💗",
  "Habrá calma, risas y abrazos ✨",
  "Mira cómo el sí se siente mejor 👀",
  "Creo que tu corazón ya decidió 💕",
  "Ok… ya no hay escapatoria 😌💘"
];

let count=0;
let yesScale=1;
let noScale=1;

const yes=document.getElementById("yesBtn");
const no=document.getElementById("noBtn");
const text=document.getElementById("text");

no.onclick=()=>{
  text.innerText=phrases[count%phrases.length];
  count++;

  yesScale+=0.08;
  yes.style.transform=`scale(${yesScale})`;

  noScale-=0.08;
  if(noScale<0.45) noScale=0.45;
  no.style.transform=`scale(${noScale})`;

  yes.style.filter="brightness(0.95)";
  no.style.filter="brightness(0.85)";

  yes.style.left=46+Math.random()*8+"%";
  no.style.left=Math.random()*30+"%";
  no.style.top=90+Math.random()*40+"px";
};

yes.onclick=()=>{
  document.body.style.background="linear-gradient(135deg,#fdeff4,#fbc8d4)";
  document.getElementById("card").innerHTML=`
    <h1>🥰💞</h1>
    <p>Sabía que dirías que sí, Hanni 💗</p>
    <p><strong>Ahora dale un beso a tu novio y desbloquea tu recompensa 💋✨</strong></p>
    <p style="font-size:14px;color:#a77;">(toca la pantalla 🤍)</p>
  `;

  // 🎶 Inicia Iris SOLO al presionar "Sí"
  document.getElementById("music").src =
    "https://www.youtube.com/embed/NdYWuo9OFAw?autoplay=1&loop=1&playlist=NdYWuo9OFAw";
};

// fuegos
document.body.addEventListener("click",e=>{
  for(let i=0;i<12;i++){
    const s=document.createElement("span");
    s.className="spark";
    s.innerHTML="💗";
    s.style.left=e.clientX+"px";
    s.style.top=e.clientY+"px";
    s.style.setProperty("--x",(Math.random()*180-90)+"px");
    s.style.setProperty("--y",(Math.random()*180-90)+"px");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1100);
  }
});
</script>

</body>
</html>
